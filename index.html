<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>게시판</title>
<style>
:root{
  --bg:#f5f6f8;--surface:#fff;--text:#1d2330;--muted:#6b7385;--line:#e1e4ea;--accent:#2f5bea;--accent-text:#fff;--danger:#d23b3b;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#14171d;--surface:#1c2028;--text:#e8ebf1;--muted:#97a0b2;--line:#2c323d;--accent:#6c8cff;--accent-text:#101319;--danger:#ff7676;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#14171d;--surface:#1c2028;--text:#e8ebf1;--muted:#97a0b2;--line:#2c323d;--accent:#6c8cff;--accent-text:#101319;--danger:#ff7676;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.6}
.wrap{max-width:720px;margin:0 auto;padding:32px 16px 64px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
h1{font-size:1.6rem;margin:0}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{background:var(--accent);color:var(--accent-text);border:0;border-radius:8px;padding:9px 16px;font-weight:600}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--line)}
.search{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--text);font:inherit;margin-bottom:12px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.row{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:14px 16px;color:inherit}
.row:last-child{border-bottom:0}
.row:hover{background:color-mix(in srgb,var(--accent) 7%,transparent)}
.row .t{font-weight:600}
.row .m{color:var(--muted);font-size:.85rem;margin-top:2px}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px}
.panel h2{margin:0 0 4px;font-size:1.25rem;overflow-wrap:anywhere}
.panel .m{color:var(--muted);font-size:.85rem;margin-bottom:16px}
.body{white-space:pre-wrap;overflow-wrap:anywhere;margin-bottom:20px}
.actions{display:flex;gap:8px}
label{display:block;font-weight:600;font-size:.9rem;margin:14px 0 6px}
input.f,textarea.f{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font:inherit}
textarea.f{min-height:180px;resize:vertical}
.err{color:var(--danger);font-size:.85rem;min-height:1.2em;margin-top:8px}
.hidden{display:none}
@media (prefers-reduced-motion:no-preference){.row{transition:background .15s}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>게시판</h1>
    <button class="btn" id="newBtn">글쓰기</button>
  </header>

  <section id="listView">
    <input class="search" id="q" type="search" placeholder="제목·작성자 검색" aria-label="검색">
    <div class="list" id="list"></div>
  </section>

  <section id="detailView" class="panel hidden">
    <h2 id="dTitle"></h2>
    <div class="m" id="dMeta"></div>
    <div class="body" id="dBody"></div>
    <div class="actions">
      <button class="btn ghost" id="backBtn">목록</button>
      <button class="btn danger" id="delBtn">삭제</button>
    </div>
  </section>

  <section id="formView" class="panel hidden">
    <h2>새 글 작성</h2>
    <label for="fAuthor">작성자</label>
    <input class="f" id="fAuthor" maxlength="20">
    <label for="fTitle">제목</label>
    <input class="f" id="fTitle" maxlength="80">
    <label for="fBody">내용</label>
    <textarea class="f" id="fBody"></textarea>
    <div class="err" id="err" role="alert"></div>
    <div class="actions">
      <button class="btn" id="saveBtn">등록</button>
      <button class="btn ghost" id="cancelBtn">취소</button>
    </div>
  </section>
</div>

<script>
(function(){
  var KEY="board-posts-v1";
  var posts=[];
  var current=null;
  var $=function(id){return document.getElementById(id)};

  function load(){
    try{
      var raw=localStorage.getItem(KEY);
      if(raw){var p=JSON.parse(raw);if(Array.isArray(p))return p;}
    }catch(e){}
    return [{id:1,author:"관리자",title:"게시판에 오신 것을 환영합니다",body:"글쓰기 버튼으로 새 글을 등록할 수 있어요.\n글은 이 브라우저에 저장됩니다.",at:Date.now()}];
  }
  function save(){try{localStorage.setItem(KEY,JSON.stringify(posts));}catch(e){}}

  function fmt(t){
    var d=new Date(t),p=function(n){return String(n).padStart(2,"0")};
    return d.getFullYear()+"."+p(d.getMonth()+1)+"."+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes());
  }
  function show(name){
    ["listView","detailView","formView"].forEach(function(v){$(v).classList.toggle("hidden",v!==name)});
    $("newBtn").classList.toggle("hidden",name!=="listView");
  }
  function render(){
    var kw=$("q").value.trim().toLowerCase();
    var items=posts.filter(function(p){return !kw||(p.title+" "+p.author).toLowerCase().indexOf(kw)>-1})
                   .sort(function(a,b){return b.at-a.at});
    var box=$("list");
    box.textContent="";
    if(!items.length){
      var e=document.createElement("div");e.className="empty";
      e.textContent=kw?"검색 결과가 없습니다.":"아직 글이 없습니다. 첫 글을 작성해 보세요.";
      box.appendChild(e);return;
    }
    items.forEach(function(p){
      var b=document.createElement("button");b.className="row";
      var t=document.createElement("div");t.className="t";t.textContent=p.title;
      var m=document.createElement("div");m.className="m";m.textContent=p.author+" · "+fmt(p.at);
      b.appendChild(t);b.appendChild(m);
      b.onclick=function(){open(p.id)};
      box.appendChild(b);
    });
  }
  function open(id){
    var p=posts.find(function(x){return x.id===id});
    if(!p)return;
    current=id;
    $("dTitle").textContent=p.title;
    $("dMeta").textContent=p.author+" · "+fmt(p.at);
    $("dBody").textContent=p.body;
    show("detailView");
  }

  $("newBtn").onclick=function(){
    $("fAuthor").value="";$("fTitle").value="";$("fBody").value="";$("err").textContent="";
    show("formView");$("fAuthor").focus();
  };
  $("cancelBtn").onclick=function(){show("listView")};
  $("backBtn").onclick=function(){show("listView")};
  $("q").oninput=render;
  $("saveBtn").onclick=function(){
    var a=$("fAuthor").value.trim(),t=$("fTitle").value.trim(),b=$("fBody").value.trim();
    if(!a||!t||!b){$("err").textContent="작성자, 제목, 내용을 모두 입력해 주세요.";return;}
    var id=posts.reduce(function(m,p){return Math.max(m,p.id)},0)+1;
    posts.push({id:id,author:a,title:t,body:b,at:Date.now()});
    save();render();show("listView");
  };
  $("delBtn").onclick=function(){
    if(!confirm("이 글을 삭제할까요?"))return;
    posts=posts.filter(function(p){return p.id!==current});
    save();render();show("listView");
  };

  posts=load();render();show("listView");
})();
</script>
</body>
</html>
